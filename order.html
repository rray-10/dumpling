<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>訂單查詢｜金邊鍋貼</title>
  <meta name="description" content="輸入訂單編號與電話，查詢金邊鍋貼訂單的品項、金額與製作進度。" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#3B2A1E" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wood: { DEFAULT: '#3B2A1E', light: '#5C4330' },
            ember: { DEFAULT: '#E07A2E', dark: '#B85E1E' },
            cream: { DEFAULT: '#FBF6EE', dark: '#F3EADB' }
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
            serif: ['"Noto Serif TC"', 'Georgia', 'serif']
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
    body { background-color: #FBF6EE; color: #3B2A1E; }
  </style>
</head>
<body class="font-sans antialiased" x-data="orderLookup()" x-init="init()">

<header class="sticky top-0 z-40 bg-cream/90 backdrop-blur border-b border-wood/10">
  <nav class="mx-auto flex h-16 max-w-3xl items-center justify-between px-4 sm:px-6">
    <a href="index.html" class="flex items-center gap-2">
      <img src="icons/favicon-32.png" alt="" class="h-7 w-7" />
      <span class="font-serif text-lg font-bold tracking-wider">金邊鍋貼</span>
    </a>
    <a href="index.html#order" class="rounded-full bg-ember px-4 py-2 text-sm font-semibold text-white shadow-md shadow-ember/30 transition hover:bg-ember-dark">繼續點餐</a>
  </nav>
</header>

<main class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
  <h1 class="font-serif text-3xl font-bold">訂單查詢</h1>
  <p class="mt-2 text-sm text-wood/70">輸入訂單編號與下單時填寫的電話，即可查看訂單進度。</p>

  <!-- 查詢表單 -->
  <form @submit.prevent="query()" class="mt-6 grid gap-4 rounded-2xl bg-white p-5 ring-1 ring-wood/10 sm:grid-cols-[1fr_1fr_auto] sm:items-end">
    <label class="block">
      <span class="mb-1.5 block text-sm font-medium">訂單編號</span>
      <input x-model="no" required placeholder="例如 JB261118001" autocomplete="off"
             class="w-full rounded-xl border bg-white px-4 py-3 text-sm uppercase tracking-wider focus:border-ember focus:outline-none" />
    </label>
    <label class="block">
      <span class="mb-1.5 block text-sm font-medium">電話</span>
      <input x-model="phone" type="tel" required placeholder="下單時的電話" autocomplete="tel"
             class="w-full rounded-xl border bg-white px-4 py-3 text-sm focus:border-ember focus:outline-none" />
    </label>
    <button type="submit" :disabled="loading"
            class="rounded-full bg-wood px-6 py-3 font-semibold text-cream transition hover:bg-ember disabled:cursor-wait disabled:opacity-60">
      <span x-text="loading && !order ? '查詢中…' : '查詢'"></span>
    </button>
  </form>

  <p x-show="error" x-cloak x-text="error" class="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm text-red-700 ring-1 ring-red-200"></p>

  <!-- 查詢結果 -->
  <section x-show="order" x-cloak class="mt-8 rounded-2xl bg-white p-5 ring-1 ring-wood/10 sm:p-7">
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        <p class="text-sm text-wood/60">訂單編號</p>
        <p class="text-xl font-bold tracking-wider text-ember" x-text="order && order.orderNo"></p>
        <p class="mt-1 text-xs text-wood/60">
          <span x-text="order && order.type"></span> · 下單 <span x-text="order && order.createdAt"></span>
        </p>
      </div>
      <button type="button" @click="query()" :disabled="loading"
              class="inline-flex items-center gap-2 rounded-full border border-wood/20 px-4 py-2 text-sm font-semibold transition hover:border-ember hover:text-ember disabled:opacity-60">
        <svg :class="loading && 'animate-spin'" class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        <span x-text="loading ? '查詢中…' : '重新查詢'"></span>
      </button>
    </div>

    <!-- 狀態進度 -->
    <ol class="mt-7 grid grid-cols-4 gap-2">
      <template x-for="(s, i) in STATUSES" :key="s">
        <li class="flex flex-col items-center text-center">
          <span class="grid h-9 w-9 place-items-center rounded-full text-sm font-bold transition"
                :class="i < step ? 'bg-ember/20 text-ember' : i === step ? 'bg-ember text-white ring-4 ring-ember/20' : 'bg-cream-dark text-wood/40'"
                x-text="i < step ? '✓' : i + 1"></span>
          <span class="mt-2 text-xs sm:text-sm" :class="i === step ? 'font-bold text-ember' : i < step ? 'text-wood' : 'text-wood/40'" x-text="s"></span>
        </li>
      </template>
    </ol>
    <p class="mt-5 rounded-xl bg-cream px-4 py-3 text-sm">
      目前狀態：<b class="text-ember" x-text="order && order.status"></b>
      <span class="ml-2 text-wood/60">最後更新：<span x-text="order && order.updatedAt"></span></span>
    </p>
    <p class="mt-2 text-xs text-wood/50">查詢時間：<span x-text="checkedAt"></span></p>

    <!-- 品項 -->
    <div class="mt-6 overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-left text-wood/60">
          <tr class="border-b border-wood/10"><th class="py-2 font-medium">品項</th><th class="py-2 text-right font-medium">單價</th><th class="py-2 text-right font-medium">數量</th><th class="py-2 text-right font-medium">小計</th></tr>
        </thead>
        <tbody>
          <template x-for="it in (order ? order.items : [])" :key="it.name">
            <tr class="border-b border-wood/5">
              <td class="py-2.5 pr-2" x-text="it.name"></td>
              <td class="py-2.5 text-right" x-text="fmt(it.price)"></td>
              <td class="py-2.5 text-right" x-text="it.qty"></td>
              <td class="py-2.5 text-right" x-text="fmt(it.price * it.qty)"></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
    <dl class="mt-4 space-y-1 text-sm">
      <div class="flex justify-between"><dt class="text-wood/60">小計</dt><dd x-text="order && fmt(order.subtotal)"></dd></div>
      <div class="flex justify-between"><dt class="text-wood/60">運費</dt><dd x-text="order && fmt(order.shipping)"></dd></div>
      <div class="flex justify-between border-t border-wood/10 pt-2 text-base font-bold"><dt>應付總額</dt><dd class="text-ember" x-text="order && fmt(order.total)"></dd></div>
    </dl>
  </section>
</main>

<script>
  // 與 index.html 相同的 Google Apps Script 網址
  const ORDER_ENDPOINT = 'https://script.google.com/macros/s/AKfycbw-npp83itWGzzNg6ZD3GcP4uOMo9QYNAcIZAb8f3hnpk6nusUeBRMVdjMJu0azkqlP/exec';

  function orderLookup() {
    return {
      STATUSES: ['已收到', '製作中', '可取餐', '已完成'],
      no: '', phone: '', order: null, error: '', loading: false, checkedAt: '',
      get step() { return this.order ? Math.max(this.order.statusStep, 0) : -1; },

      init() {
        let saved = {};
        try { saved = JSON.parse(localStorage.getItem('jb_lookup') || '{}') || {}; } catch (e) {}
        const urlNo = new URLSearchParams(location.search).get('no');
        this.no = urlNo || saved.no || '';
        this.phone = (!urlNo || urlNo === saved.no) ? (saved.phone || '') : '';
        if (this.no && this.phone) this.query();
      },

      fmt(n) { return 'NT$ ' + Number(n || 0).toLocaleString(); },

      async query() {
        if (this.loading) return;
        const no = this.no.trim().toUpperCase();
        const phone = this.phone.trim();
        if (!no || !phone) { this.error = '請輸入訂單編號與電話'; return; }
        if (!ORDER_ENDPOINT) { this.error = '尚未設定訂單系統，無法查詢'; return; }

        this.loading = true; this.error = '';
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 20000);
        try {
          const url = ORDER_ENDPOINT + '?action=order&no=' + encodeURIComponent(no)
            + '&phone=' + encodeURIComponent(phone) + '&t=' + Date.now();
          const res = await fetch(url, { signal: ctrl.signal, cache: 'no-store' });
          const data = await res.json();
          if (!data.ok) throw Object.assign(new Error(data.error || '查詢失敗'), { known: true });
          this.order = data;
          this.no = no;
          this.checkedAt = new Date().toLocaleString('zh-TW', { hour12: false });
          try { localStorage.setItem('jb_lookup', JSON.stringify({ no, phone })); } catch (e) {}
        } catch (err) {
          if (err.known) this.order = null;   // 網路錯誤時保留上次結果
          this.error = err.known ? err.message : '查詢失敗，請檢查網路後再試一次';
        } finally {
          clearTimeout(timer);
          this.loading = false;
        }
      }
    };
  }
</script>
</body>
</html>
